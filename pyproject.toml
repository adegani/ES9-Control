[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "es9-control"
version = "0.1.0"
description = "Applicazione GUI per il controllo di es9"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "mido"
]

[project.scripts]
es9-control = "es9_control.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/es9_control"]