[package]
name = "es9-control"
version = "0.1.0"
description = "Desktop configuration tool for the Expert Sleepers ES-9"
edition = "2021"

[lib]
name = "es9_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
midir = "0.11"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
